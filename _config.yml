# Fatih Furkan Çambel — personal blog. Jekyll site built natively by GitHub Pages (Settings → Pages → Deploy from branch: main).
# How to add content: see CLAUDE.md.
title: Fatih Furkan Çambel
tagline: Yazılım, İngilizce ve Finans Notları   # homepage <title> = "<title> | <tagline>" (keep total ≤ 60 chars)
motto: No one is in charge of your happiness except you        # shown in the footer
description: Fatih Furkan Çambel'in kişisel blogu. Yazılım, İngilizce, finans, bilim, tarih ve kişisel gelişim üzerine notlar ve yazılar.
url: https://cambelfatih.github.io
baseurl: /blog
lang: tr_TR
timezone: UTC
author:
  name: Fatih Furkan Çambel
  type: Person
  url: https://cambelfatih.github.io/blog/about/
logo: /assets/icon-512.png
social:                # JSON-LD sameAs on the homepage
  name: Fatih Furkan Çambel
  links:
    - https://github.com/CambelFatih
webmaster_verifications:   # jekyll-seo-tag renders <meta name="google-site-verification">; keep alongside google40725d501500b265.html
  google: EiSHkrvFt6jie1Ytj7ztN6Dk1KmmL9uCfpWXIZrdR9w

seo_paginator_message: "Sayfa %<current>s / %<total>s · "

permalink: /:year/:month/:day/:title/
future: true          # posts dated later today still publish
excerpt_separator: "" # excerpts unused; avoids splitting {% raw %} blocks in legacy posts
paginate: 13          # 1 featured + 12 grid cards per page
paginate_path: /page/:num/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true     # Prism highlights both Markdown and legacy HTML code blocks

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

defaults:
  - scope: { path: "" }
    values: { image: /assets/og-default.jpg }   # social preview fallback; posts override with their own image
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "wp-content" }
    values: { sitemap: false }
  - scope: { path: "dashboard" }
    values: { sitemap: false }
  - scope: { path: "dw" }
    values: { sitemap: false }
  - scope: { path: "google40725d501500b265.html" }  # Search Console verification
    values: { sitemap: false }

exclude:
  - CLAUDE.md
  - README.md
  - vendor
  - tools
  - .jekyll-cache

months: [Ocak, Şubat, Mart, Nisan, Mayıs, Haziran, Temmuz, Ağustos, Eylül, Ekim, Kasım, Aralık]

nav:
  - { title: Ana Sayfa, url: / }
  - { title: Kategoriler, url: /category/ }
  - { title: Arşiv, url: /archive/ }
  - { title: Hakkımda, url: /about/ }
